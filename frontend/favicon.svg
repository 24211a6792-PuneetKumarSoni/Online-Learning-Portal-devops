<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="pathshalaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Modern Rounded Icon Background -->
  <rect width="64" height="64" rx="16" fill="url(#pathshalaGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5"/>

  <!-- Academic Graduation Cap Emblem -->
  <g filter="url(#shadow)">
    <!-- Cap Diamond Top -->
    <polygon points="32,16 52,25.5 32,35 12,25.5" fill="#ffffff"/>
    
    <!-- Cap Lower Skullcap -->
    <path d="M20,30.5 L20,38 C20,44.5 44,44.5 44,38 L44,30.5 L32,36.5 Z" fill="#e2e8f0"/>
    
    <!-- Tassel and Golden Cord -->
    <path d="M47,28 L51,33 L51,43" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="51" cy="44" r="2" fill="url(#goldGrad)"/>
  </g>
</svg>
